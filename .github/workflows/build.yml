name: Build Go Mo APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          rm -rf src && unzip -q -o "$ZIP" -d src
          echo "PROJ=$(dirname $(find src -name settings.gradle | head -1))" >> $GITHUB_ENV
      - name: Build APK
        run: cd "$PROJ" && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GoMo-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
